<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário de Dados — SINESP CAD</title>
<meta name="description" content="Dicionário de dados navegável dos schemas CAD_OCORRENCIA, do SINESP CAD 3, e CAD_RECURSOS, do SINESP CAD 2.">

<!-- Padrão Digital de Governo — assets vendorizados por tools/baixar_assets_ds.py.
     Nada aqui vem de CDN: ver documentacao/decisoes.md, ADR-003. A fonte Raleway,
     que o template oficial carrega do Google Fonts, é apenas fallback da Rawline —
     como a Rawline está local, ela nunca chega a ser requisitada. -->
<link rel="stylesheet" href="assets/fonts/rawline/css/rawline.css">
<link rel="stylesheet" href="assets/govbr/core.min.css">
<link rel="stylesheet" href="assets/fontawesome/css/all.min.css">

<!-- O `?v=` força o navegador a buscar a versão nova em vez de servir a do
     cache. Só os dois arquivos que mudam com frequência precisam disso; os
     assets do DS são imutáveis dentro de uma versão.
     IMPORTANTE: incremente o número ao editar styles.css ou app.js — sem isso,
     quem já visitou o site continua vendo a versão anterior por dias. -->
<link rel="stylesheet" href="styles.css?v=4">

<!-- TODO: trocar pelo favicon do órgão antes de publicar. -->
<link rel="icon" href="assets/img/govbr.png">
</head>
<body>

<div class="template-base">

  <nav class="br-skiplink" role="menubar">
    <a class="br-item" href="#main-content" role="menuitem" accesskey="1">Ir para o conteúdo <span aria-hidden="true">(1/4)</span> <span aria-hidden="true" class="br-tag text ml-1">1</span></a>
    <a class="br-item" href="#header-navigation" role="menuitem" accesskey="2">Ir para o menu <span aria-hidden="true">(2/4)</span> <span aria-hidden="true" class="br-tag text ml-1">2</span></a>
    <a class="br-item" href="#main-searchbox" role="menuitem" accesskey="3">Ir para a busca <span aria-hidden="true">(3/4)</span> <span aria-hidden="true" class="br-tag text ml-1">3</span></a>
    <a class="br-item" href="#footer" role="menuitem" accesskey="4">Ir para o rodapé <span aria-hidden="true">(4/4)</span> <span aria-hidden="true" class="br-tag text ml-1">4</span></a>
  </nav>

  <header class="br-header" id="header" data-sticky="data-sticky">
    <div class="container-lg">

      <div class="header-top">
        <div class="header-logo">
          <img src="assets/img/govbr.png" alt="gov.br">
          <span class="br-divider vertical"></span>
          <div class="header-sign">Ministério da Justiça e Segurança Pública</div>
        </div>

        <div class="header-actions">
          <div class="header-links dropdown">
            <button class="br-button circle small" type="button" data-toggle="dropdown" aria-label="Abrir Acesso Rápido">
              <i class="fas fa-ellipsis-v" aria-hidden="true"></i>
            </button>
            <div class="br-list">
              <div class="header">
                <div class="title">Acesso Rápido</div>
              </div>
              <!-- Os href seguem o schema ativo; o app.js os reescreve a cada troca. -->
              <a class="br-item" id="atalho-inicio" href="#/">Início</a>
              <a class="br-item" id="atalho-mapa" href="#/mapa">Mapa de relacionamentos</a>
            </div>
          </div>
          <span class="br-divider vertical mx-half mx-sm-1"></span>
          <div class="header-search-trigger">
            <button class="br-button circle" type="button" aria-label="Abrir Busca" data-toggle="search" data-target=".header-search">
              <i class="fas fa-search" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="header-bottom">
        <div class="header-menu">
          <div class="header-menu-trigger" id="header-navigation">
            <button class="br-button small circle" type="button" aria-label="Menu"
                    data-toggle="menu" data-target="#main-navigation" id="navigation">
              <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
          </div>
          <div class="header-info">
            <div class="header-title">Dicionário de Dados</div>
            <!-- Preenchido pelo app.js com o sistema e o schema em exibição. -->
            <div class="header-subtitle" id="rotulo-schema">SINESP CAD</div>
          </div>
        </div>

        <div class="header-search" id="main-searchbox">
          <!-- O <form> existe para que o Enter dispare a busca e para expor
               role="search"; o CSS o torna transparente ao layout do DS. -->
          <form class="busca-form" id="form-busca" role="search">
            <!-- `has-icon` aqui serve ao botão da direita: o que a classe faz é
                 abrir padding-right no campo, não posicionar ícone à esquerda. -->
            <div class="br-input has-icon">
              <label for="busca-global">Buscar tabela, coluna ou descrição</label>
              <input id="busca-global" type="search" placeholder="Buscar tabela, coluna ou descrição…"
                     autocomplete="off" spellcheck="false">
              <button class="br-button circle small" type="submit" aria-label="Pesquisar">
                <i class="fas fa-search" aria-hidden="true"></i>
              </button>
            </div>
          </form>
          <button class="br-button circle search-close ml-1" type="button" aria-label="Fechar Busca" data-dismiss="search">
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>
      </div>

    </div>
  </header>

  <main class="d-flex flex-fill mb-5" id="main">
    <div class="container-lg d-flex">
      <div class="row">

        <!-- br-menu no modo offcanvas padrão: no mobile o DS cuida de tudo
             (véu, botão de fechar, foco). A partir de 992px o CSS o fixa
             aberto — ver ADR-005. O modificador `push` não serve aqui porque
             esconde o véu e o cabeçalho do menu, deixando o mobile sem forma
             de fechar. -->
        <div class="br-menu" id="main-navigation">
          <div class="menu-container">
            <div class="menu-panel">

              <div class="menu-header">
                <div class="menu-title">
                  <span>Tabelas do dicionário</span>
                </div>
                <div class="menu-close">
                  <button class="br-button circle" type="button" aria-label="Fechar o menu" data-dismiss="menu">
                    <i class="fas fa-times" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <!-- Seletor de schema, preenchido pelo app.js a partir do registro
                   SCHEMAS. Com um só dataset carregado ele fica vazio e o CSS o
                   esconde, devolvendo o menu ao formato de schema único. -->
              <div class="menu-schemas" id="seletor-schema" role="group" aria-label="Schema em exibição"></div>

              <!-- Filtro incremental das tabelas. O br-menu do DS não prevê
                   busca interna, então este bloco é próprio, montado com o
                   br-input do padrão. Sem `.input-icon`: ele é position:absolute
                   sem `top`, então ancora no topo do .br-input e cai sobre o
                   label em vez de ficar sobre o campo. -->
              <div class="menu-filtro">
                <div class="br-input">
                  <label for="filtro-tabelas">
                    Filtrar tabelas
                    <span class="contador" id="contador-tabelas" aria-live="polite"></span>
                  </label>
                  <input id="filtro-tabelas" type="search" placeholder="Filtrar tabelas…"
                         autocomplete="off" spellcheck="false">
                </div>
              </div>

              <nav class="menu-body" id="lista-tabelas" role="tree" aria-label="Lista de tabelas"></nav>

            </div>
            <div class="menu-scrim" data-dismiss="menu" tabindex="0"></div>
          </div>
        </div>

        <div class="col mb-5">
          <nav class="br-breadcrumb" id="trilha" aria-label="Breadcrumbs">
            <ol class="crumb-list" id="lista-trilha" role="list"></ol>
          </nav>
          <div class="main-content pl-sm-3 mt-4" id="main-content" tabindex="-1"></div>
        </div>

      </div>
    </div>
  </main>

  <footer class="br-footer pt-3" id="footer">
    <div class="container-lg">
      <div class="info">
        <div class="text-down-01 text-medium pb-2">Ministério da Justiça e Segurança Pública</div>
      </div>
    </div>
  </footer>

</div>

<!-- ==================================================================== -->
<!-- VLibras — tradução para Libras. Snippet do manual oficial do widget. -->
<!-- ==================================================================== -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

<!-- Os dados e o app.js primeiro: o app monta o menu e a trilha, e só então o
     core-init instancia os componentes do DS sobre o DOM já completo. Um
     arquivo de dados por schema; o registro SCHEMAS do app.js os reúne. -->
<script src="dados.js"></script>
<script src="dados-recursos.js"></script>
<script src="app.js?v=4"></script>
<script src="assets/govbr/core-init.min.js"></script>
</body>
</html>
